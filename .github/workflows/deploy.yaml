name: Deploy Turkish Vacuum Web

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Self-contained: .NET çalışma zamanı uygulamayla birlikte paketlenir,
    # sunucuda .NET kurulu olması gerekmez. Sunucu ARM ise linux-arm64 kullanın.
    - name: Publish Web
      working-directory: TurkishVacuum
      run: dotnet publish TurkishVacuum.Web/TurkishVacuum.Web.csproj -c Release -r linux-x64 --self-contained true -o ${{ github.workspace }}/publish

    - name: Deploy to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "publish/*"
        target: "/var/www/turkishvacuum/web/publish"
        strip_components: 1
        
    - name: Restart Turkish Vacuum Web
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          chmod +x /var/www/turkishvacuum/web/publish/TurkishVacuum.Web
          sudo systemctl restart turkishvacuum-web
          sudo systemctl status turkishvacuum-web --no-pager
